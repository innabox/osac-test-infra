---
- name: Reset OCP installation for re-deploy
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Find OCP server VM
      ansible.builtin.shell:
        cmd: virsh list --all --name | grep "{{ ocp_vm_name_pattern }}"
      register: _vm_lookup
      changed_when: false
      failed_when: false

    - name: Set VM name
      ansible.builtin.set_fact:
        ocp_vm_name: "{{ _vm_lookup.stdout_lines[0] | default('') }}"
      when: _vm_lookup.rc == 0

    - name: Shut down VM if running
      ansible.builtin.command:
        cmd: virsh destroy {{ ocp_vm_name }}
      when: ocp_vm_name | default('') | length > 0
      failed_when: false
      changed_when: true

    - name: Remove kubeconfig files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/kubeconfig.{{ ocp_cluster_name }}
        - /root/.kube/config

    - name: Recreate blank install disk
      ansible.builtin.command:
        cmd: qemu-img create -f qcow2 /var/lib/libvirt/images/hgx-00-ocp.qcow2 {{ ocp_install_disk_gb }}G
      changed_when: true

    - name: Recreate blank LVM disk
      ansible.builtin.command:
        cmd: qemu-img create -f qcow2 /var/lib/libvirt/images/hgx-00-lvm.qcow2 {{ ocp_lvm_disk_gb }}G
      changed_when: true

    - name: Reserve OCP VM bmc-net address before boot
      when: bare_metal_services | default(false) | bool
      ansible.builtin.include_role:
        name: reserve-ocp-bmc

    - name: Start VM
      ansible.builtin.command:
        cmd: virsh start {{ ocp_vm_name }}
      when: ocp_vm_name | default('') | length > 0
      changed_when: true

    - name: Remove dnsmasq OCP config
      ansible.builtin.file:
        path: /etc/dnsmasq.d/ocp-sno.conf
        state: absent
      register: _dnsmasq_config_removed

    - name: Restart dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: restarted
      when: _dnsmasq_config_removed is changed
      failed_when: false

    - name: Report reset complete
      ansible.builtin.debug:
        msg: "OCP reset complete. VM {{ ocp_vm_name | default('unknown') }} booted with fresh disk. Run 'make deploy-ocp' to reinstall."
