---
name: Prepare Diagnosis For Slack
description: >-
  Reads the DIAGNOSIS_FILE written by ai-diagnose-failure.py (if present),
  converts GitHub-flavored markdown to Slack mrkdwn (bold, links), and
  truncates it for a Slack thread reply. Shared by every E2E full-install
  flavor (CaaS/VMaaS/BMaaS) that threads the AI diagnosis onto its Slack
  failure notification -- previously ~35 lines of identical bash+python
  duplicated verbatim in each of those workflow files.

inputs:
  diagnosis-file:
    description: 'Path to the DIAGNOSIS_FILE written by ai-diagnose-failure.py'
    required: true

outputs:
  text:
    description: >-
      Slack mrkdwn-ready diagnosis text, truncated to a skimmable length --
      or a fallback message if the file is missing/empty.
    value: ${{ steps.prepare.outputs.text }}

runs:
  using: composite
  steps:
    - name: Prepare diagnosis text
      id: prepare
      shell: bash
      env:
        DIAGNOSIS_FILE: ${{ inputs.diagnosis-file }}
      run: |
        set -euo pipefail
        if [[ -s "${DIAGNOSIS_FILE}" ]]; then
          TEXT=$(python3 - "$DIAGNOSIS_FILE" <<'PYEOF'
        import re
        import sys

        text = open(sys.argv[1], "r", errors="replace").read()

        # Shared by both fence-aware steps below (blank-line collapsing and
        # truncation). Naively matching any "```" as both open and close
        # (regardless of actual backtick-run length) breaks on GFM's real
        # fence rule: a fence delimiter can be 3+ backticks, and only a
        # line whose OWN run is at least that long closes it -- a shorter
        # run nested inside (e.g. a literal "```" line quoted inside a
        # "````" block, itself plausible Evidence content if the model
        # needs to safely quote something that already contains a fence)
        # is just ordinary content, not a real boundary. Scanning line-by-
        # line and tracking the opening run's length avoids that.
        _FENCE_OPEN_RE = re.compile(r"^(`{3,})")
        _FENCE_CLOSE_RE = re.compile(r"^(`{3,})\s*$")

        def _find_fenced_spans(s):
            """(start, end) char offsets of every fenced code block in
            `s`. An unterminated fence (no valid closing run anywhere
            after it) spans to the end of `s` -- callers treat that as
            still "inside" a fence, matching how no renderer would ever
            show a dangling opening marker as a real code block anyway.
            """
            spans = []
            open_start = open_len = None
            pos = 0
            for line in s.split("\n"):
                if open_len is None:
                    m = _FENCE_OPEN_RE.match(line)
                    if m:
                        open_len = len(m.group(1))
                        open_start = pos
                else:
                    m = _FENCE_CLOSE_RE.match(line)
                    if m and len(m.group(1)) >= open_len:
                        spans.append((open_start, pos + len(line)))
                        open_start = open_len = None
                pos += len(line) + 1
            if open_len is not None:
                spans.append((open_start, len(s)))
            return spans

        def _split_around_fences(s):
            """[outside, fence, outside, fence, ..., outside] -- same
            alternating shape as re.split(pattern, s), but with spec-
            correct fence boundaries from _find_fenced_spans.
            """
            pieces = []
            cursor = 0
            for start, end in _find_fenced_spans(s):
                pieces.append(s[cursor:start])
                pieces.append(s[start:end])
                cursor = end
            pieces.append(s[cursor:])
            return pieces

        # Best-effort GitHub-flavored-markdown -> Slack mrkdwn.
        #
        # 1. Strip the <details>/<summary>/<sub> HTML wrappers this
        #    pipeline's own diagnosis structure uses for GitHub's renderer
        #    (collapsible sections, small text) -- unwrapped, not removed,
        #    since their inner content still matters. Slack has no
        #    equivalent, and critically, angle brackets are ALSO Slack's
        #    own link/mention syntax -- confirmed live: a
        #    "<sub>[Full run](url)</sub>" footer link came out with its
        #    URL missing entirely once posted, because the un-stripped
        #    <sub> wrapper turned the link conversion below into a nested
        #    angle-bracket structure Slack's parser doesn't handle. Must
        #    run BEFORE the link conversion for exactly that reason.
        text = re.sub(r"</?details>", "", text)
        text = re.sub(r"</?summary>", "", text)
        text = re.sub(r"</?sub>", "", text)
        # 1b. Each stripped tag leaves its own original surrounding blank
        #     lines behind (build_diagnosis_body's collapse() wraps each
        #     section in its own blank-line-padded <details> block for
        #     GitHub's benefit), which stack into 2-4 blank lines in a row
        #     once unwrapped here -- confirmed live, a real posted message
        #     had 4 blank lines between sections. Collapse any run of 3+
        #     newlines down to exactly one blank line (2 newlines) --
        #     but ONLY between fenced blocks, never inside one: Evidence
        #     quotes verbatim log/YAML content that can legitimately
        #     contain its own multi-blank-line runs, and the prompt
        #     requires those quotes to be exact, not paraphrased --
        #     silently collapsing whitespace inside one would violate
        #     that. _split_around_fences keeps every fenced span (the
        #     odd-indexed pieces) untouched; only the wrapper text
        #     between them gets the collapse applied.
        pieces = _split_around_fences(text)
        for i in range(0, len(pieces), 2):
            pieces[i] = re.sub(r"\n{3,}", "\n\n", pieces[i])
        text = "".join(pieces)
        # 2. Markdown headers (### Causal chain) have no Slack mrkdwn
        #    equivalent at all -- Slack would otherwise show the literal
        #    "### Causal chain" text, hashes included. Bold instead.
        text = re.sub(r"^#{1,6}\s+(.*)$", r"*\1*", text, flags=re.MULTILINE)
        # 3. Bold.
        text = re.sub(r"\*\*(.+?)\*\*", r"*\1*", text)
        # 4. Stash markdown links as placeholders BEFORE escaping (step 5)
        #    so their eventual Slack <url|text> syntax is generated AFTER
        #    escaping and survives untouched -- placeholders contain none
        #    of the characters escaping targets.
        links = []

        def _stash_link(m):
            links.append((m.group(2), m.group(1)))
            return f"\x00LINK{len(links) - 1}\x00"

        text = re.sub(r"\[([^\]]+)\]\((https?://[^)]+)\)", _stash_link, text)
        # 5. Escape any remaining literal &, <, > -- this diagnosis can
        #    quote untrusted, PR-influenced content verbatim (the prompt
        #    explicitly asks for verbatim log/diff quotes in the Evidence
        #    section), and Slack's mrkdwn parser treats a literal
        #    "<!channel>"/"<!here>"/"<!everyone>" as a real broadcast
        #    mention -- a crafted fork-PR failure could otherwise ping the
        #    whole channel. & must be escaped first, or escaping < / >
        #    afterward would double-escape the &amp; just inserted for
        #    those. Slack's own renderer decodes these entities back to
        #    the literal characters when displaying mrkdwn text, so
        #    ordinary content (e.g. a shell redirection like "2>&1"
        #    quoted from a log) still displays correctly.
        text = text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
        # 6. Put the real Slack links back now that escaping is done.
        for i, (url, label) in enumerate(links):
            text = text.replace(f"\x00LINK{i}\x00", f"<{url}|{label}>")
        # Keep the thread reply skimmable -- the run/job summary already
        # has the full text; truncate rather than dumping everything.
        # Reserves room for the suffix BEFORE slicing so the final output
        # actually stays at or under max_chars, rather than slicing to
        # max_chars and then appending the suffix on top of that (which
        # would overshoot the cap by the suffix's own length).
        max_chars = 2800
        if len(text) > max_chars:
            suffix = "\n... (truncated -- see the full run for the complete diagnosis)"
            cut = max_chars - len(suffix)
            truncated = text[:cut]
            # A naive character-count cut can land INSIDE one of Evidence's
            # fenced code blocks -- confirmed live: Slack (unlike some
            # other Markdown renderers) then renders the dangling opening
            # marker as literal text instead of a code block, and
            # everything after it loses its styling too. Computed on the
            # FULL (pre-cut) text via _find_fenced_spans, using the same
            # spec-correct fence matching as the blank-line step above --
            # this also naturally handles the cut landing mid-MARKER
            # itself (1-2 backticks into a fence delimiter), since that
            # position still falls inside the span regardless of exactly
            # which character it lands on. If the cut lands inside a real
            # span, back up to that span's START entirely, dropping the
            # whole partial block rather than posting a broken fence.
            for start, end in _find_fenced_spans(text):
                if start < cut < end:
                    truncated = text[:start].rstrip()
                    break
            text = truncated + suffix
        print(text)
        PYEOF
        )
        else
          TEXT="_AI diagnosis unavailable for this run._"
        fi
        # Random delimiter (not a fixed string like EOF) so diagnosis
        # text that happens to quote a line matching the delimiter --
        # this can embed attacker-influenced log/diff content -- can't
        # prematurely terminate the multiline output.
        DELIM="EOF_$(openssl rand -hex 8)"
        {
          echo "text<<${DELIM}"
          echo "$TEXT"
          echo "${DELIM}"
        } >> "$GITHUB_OUTPUT"
