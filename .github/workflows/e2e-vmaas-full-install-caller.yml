---
name: E2E VMaaS Full Install

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'OWNERS'
      - 'LICENSE'
      - '*.md'
      - 'docs/**'
  merge_group:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      test-suite:
        description: "Test suite (vmaas, caas, or empty for all)"
        required: false
        default: "vmaas"
      test-filter:
        description: "pytest -k filter"
        required: false
        default: ""
      test-marker:
        description: "pytest -m marker expression (e.g. sanity, regression). When empty, excludes tests marked requires_caas or requires_bmaas."
        required: false
        default: ""
      installer-ref:
        description: "Branch/ref of the OSAC monorepo"
        required: false
        default: "main"
      installer-repo:
        description: "GitHub repo (owner/name) of the OSAC monorepo"
        required: false
        default: "osac-project/osac"
      image-overrides:
        description: "JSON mapping Helm value paths to image refs"
        required: false
        default: "{}"
      osac-cli-version:
        description: "OSAC CLI version (e.g. 0.0.73). Defaults to latest."
        required: false
        default: ""
      runner-label:
        description: "Self-hosted runner label to target (e.g. osac-ci-1 to pin to one machine for verification/debugging). Defaults to the shared fleet-wide label."
        required: false
        default: ""

concurrency:
  group: e2e-vmaas-full-install-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-readiness:
    name: e2e-readiness (vmaas)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/check-e2e-readiness
      - name: Check e2e readiness
        id: check
        uses: ./.github/actions/check-e2e-readiness
        with:
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  e2e-vmaas-full-install:
    needs: [e2e-readiness]
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.e2e-readiness.result == 'skipped'
          || needs.e2e-readiness.outputs.ready == 'true')
    permissions:
      contents: read
      # Required by e2e-vmaas-full-install.yml's "e2e" job -- only
      # exercised there when enable-ai-diagnostic is true (always false
      # for fork PR runs), but GitHub statically validates a called
      # reusable workflow's declared job permissions against what the
      # caller grants regardless of runtime reachability.
      id-token: write
    uses: ./.github/workflows/e2e-vmaas-full-install.yml
    with:
      test-suite: ${{ inputs.test-suite || 'vmaas' }}
      test-filter: ${{ inputs.test-filter || '' }}
      # The references module contains CaaS and BMaaS tests too. Those
      # services are disabled in the VMaaS profile, so exclude tests marked
      # with either dependency unless an explicit workflow-dispatch marker is
      # supplied. Matches osac-project/osac#805.
      test-marker: ${{ inputs.test-marker || 'not requires_caas and not requires_bmaas' }}
      installer-ref: ${{ inputs.installer-ref || 'main' }}
      installer-repo: ${{ inputs.installer-repo || 'osac-project/osac' }}
      image-overrides: ${{ inputs.image-overrides || '{}' }}
      osac-cli-version: ${{ inputs.osac-cli-version || '' }}
      runner-label: ${{ inputs.runner-label || 'osac-ci' }}
      # Pass author_association and login for fork PR authorization (empty for non-fork PRs)
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number }}
      notify-on-failure: ${{ github.event_name == 'schedule' }}
      enable-ai-diagnostic: ${{ github.ref == 'refs/heads/main' }}

  # Skip this required check on unreadiness so it stays pending (not red).
  e2e-vmaas-gate:
    if: >-
      always()
      && (github.event_name != 'pull_request'
          || needs.e2e-readiness.result != 'success'
          || needs.e2e-readiness.outputs.ready == 'true')
    needs: [e2e-readiness, e2e-vmaas-full-install]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "e2e-readiness: ${{ needs.e2e-readiness.result }}"
          echo "e2e-vmaas-full-install: ${{ needs.e2e-vmaas-full-install.result }}"
          exit 1
      - if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "e2e passed"

  e2e-vmaas-pending:
    if: >-
      always()
      && github.event_name == 'pull_request'
      && needs.e2e-readiness.result == 'success'
      && needs.e2e-readiness.outputs.ready != 'true'
    needs: [e2e-readiness, e2e-vmaas-full-install, e2e-vmaas-gate]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Mark e2e-vmaas-gate pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_NAME: e2e-vmaas-gate
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ needs.e2e-readiness.outputs.reason }}
        run: |
          set -euo pipefail
          title="${REASON:-waiting for e2e unlock}"
          summary=$(printf '%s\n\n%s' "${title}" \
            "Need coderabbitai[bot] APPROVED on this HEAD, lgtm, or /e2e-ready.")
          payload=$(jq -n \
            --arg name "${CHECK_NAME}" \
            --arg sha "${HEAD_SHA}" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg title "${title}" \
            --arg details "${DETAILS_URL}" \
            --arg summary "${summary}" \
            '{
              name: $name,
              head_sha: $sha,
              status: "in_progress",
              details_url: $details,
              started_at: $started,
              output: {
                title: $title,
                summary: $summary
              }
            }')
          if ! gh api "repos/${REPO}/check-runs" --input - <<<"${payload}"; then
            echo "Could not post in_progress check ${CHECK_NAME} (fork PRs may lack checks:write)."
            echo "Required check stays unreported until unlock rerun."
          fi
