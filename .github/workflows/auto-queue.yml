---
name: auto-queue

# Enable GitHub auto-merge only when Prow labels are present on a live
# read of the PR (not the webhook snapshot). Missing lgtm/approved/jira,
# hold/wip/rebase, drafts, and outstanding human Request changes all
# disable auto-merge. Bot Request changes (CodeRabbit, etc.) are dismissed
# and do not block. Event-path enqueue without lgtm is how #411 merged.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

env:
  REQUIRED_LABELS_JSON: '["lgtm","approved","jira/valid-reference"]'
  BLOCKING_LABELS_JSON: '["do-not-merge/hold","do-not-merge/work-in-progress","do-not-merge/invalid-owners-file","needs-rebase"]'

jobs:
  enable-auto-merge:
    if: >-
      github.repository == 'osac-project/osac-test-infra' &&
      (github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    permissions: {}  # MERGE_QUEUE_TOKEN only
    steps:
      - name: Remove lgtm on new push
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "MERGE_QUEUE_TOKEN unavailable; skip lgtm removal."
            exit 0
          fi
          if gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]' | jq -e 'index("lgtm")' > /dev/null; then
            echo "Removing lgtm label from PR #$PR after new push"
            gh pr edit "$PR" --repo "$REPO" --remove-label lgtm
          fi

      - name: Dismiss bot changes-requested reviews
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "MERGE_QUEUE_TOKEN unavailable; skip bot review dismiss."
            exit 0
          fi
          reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR}/reviews" | jq 'add // []')
          while read -r review_id; do
            [[ -z "${review_id}" ]] && continue
            echo "Dismissing bot review ${review_id} on PR #${PR}"
            gh api "repos/${REPO}/pulls/${PR}/reviews/${review_id}/dismissals" \
              -X PUT -f message="Auto-dismissed: bot Request changes do not block merge"
          done < <(jq -r '
            .[]
            | select(.state == "CHANGES_REQUESTED")
            | select(.user != null)
            | select(((.user.login // "") | endswith("[bot]")) or ((.user.type // "") == "Bot"))
            | .id
          ' <<<"${reviews}")

      - name: Check repo collaborator
        id: org-check
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
        run: |
          echo "author=$AUTHOR"
          echo "draft=$DRAFT"
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "MERGE_QUEUE_TOKEN unavailable"
            echo "org_member=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${REPO}/collaborators/${AUTHOR}"; then
            echo "org_member=true"
            echo "org_member=true" >> "$GITHUB_OUTPUT"
          else
            echo "org_member=false"
            echo "org_member=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check merge blockers
        if: steps.org-check.outputs.org_member == 'true'
        id: label-check
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          blocked=false
          if [[ "${DRAFT}" == "true" ]]; then
            echo "PR is draft"
            blocked=true
          fi
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "MERGE_QUEUE_TOKEN unavailable; treating as blocked."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Live labels, after any lgtm strip on synchronize. Do not trust
          # github.event.pull_request.labels (stale on the same webhook).
          labels=$(gh pr view "${PR}" --repo "${REPO}" --json labels --jq '[.labels[].name]')
          echo "labels=${labels}"

          missing=$(jq -r --argjson req "${REQUIRED_LABELS_JSON}" '$req - . | .[]' <<<"${labels}")
          if [[ -n "${missing}" ]]; then
            echo "Missing required labels: ${missing}"
            blocked=true
          fi

          blocking=$(jq -r --argjson block "${BLOCKING_LABELS_JSON}" '$block - ($block - .) | .[]' <<<"${labels}")
          if [[ -n "${blocking}" ]]; then
            echo "Blocking label found: ${blocking}"
            blocked=true
          fi

          reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${PR}/reviews" | jq 'add // []')
          set +e
          jq -e '
            [.[]
              | select(.user != null)
              | select(((.user.login // "") | endswith("[bot]")) | not)
              | select((.user.type // "User") != "Bot")
              | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
            ]
            | group_by(.user.login)
            | map(max_by([(.submitted_at // ""), (.id // 0)]))
            | map(select(.state == "CHANGES_REQUESTED"))
            | length > 0
          ' <<<"${reviews}" >/dev/null
          rc=$?
          set -e
          if [[ ${rc} -eq 0 ]]; then
            echo "Human CHANGES_REQUESTED still outstanding"
            blocked=true
          elif [[ ${rc} -ne 1 ]]; then
            echo "Cannot evaluate human review state (jq rc=${rc}); treating as blocked."
            blocked=true
          fi
          echo "blocked=$blocked"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: >-
          github.event.pull_request.draft == false
          && steps.org-check.outputs.org_member == 'true'
          && steps.label-check.outputs.blocked == 'false'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --rebase

      - name: Disable auto-merge
        if: >-
          steps.org-check.outputs.org_member == 'true'
          && steps.label-check.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --disable-auto || true

  requeue-eligible-prs:
    if: >-
      github.repository == 'osac-project/osac-test-infra' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}  # MERGE_QUEUE_TOKEN only
    steps:
      - name: Reconcile auto-merge on open PRs
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "MERGE_QUEUE_TOKEN missing"
            exit 1
          fi

          human_cr_outstanding() {
            local reviews="$1"
            set +e
            jq -e '
              [.[]
                | select(.user != null)
                | select(((.user.login // "") | endswith("[bot]")) | not)
                | select((.user.type // "User") != "Bot")
                | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
              ]
              | group_by(.user.login)
              | map(max_by([(.submitted_at // ""), (.id // 0)]))
              | map(select(.state == "CHANGES_REQUESTED"))
              | length > 0
            ' <<<"${reviews}" >/dev/null
            local rc=$?
            set -e
            if [[ ${rc} -eq 0 ]]; then
              return 0
            elif [[ ${rc} -eq 1 ]]; then
              return 1
            fi
            echo "Cannot evaluate human review state (jq rc=${rc})"
            return 0
          }

          echo "Scanning open PRs..."
          prs=$(gh pr list --repo "${REPO}" --state open --limit 200 \
            --json number,isDraft,labels,autoMergeRequest)
          while read -r pr; do
            [[ -z "${pr}" ]] && continue
            meta=$(echo "$prs" | jq -c --argjson n "$pr" '.[] | select(.number == $n)')
            draft=$(jq -r '.isDraft' <<<"${meta}")
            has_auto=$(jq -r '.autoMergeRequest != null' <<<"${meta}")
            labels=$(jq -c '[.labels[].name]' <<<"${meta}")

            ineligible=false
            if [[ "${draft}" == "true" ]]; then
              ineligible=true
            fi
            missing=$(jq -r --argjson req "${REQUIRED_LABELS_JSON}" '$req - . | .[]' <<<"${labels}")
            if [[ -n "${missing}" ]]; then
              ineligible=true
            fi
            blocking=$(jq -r --argjson block "${BLOCKING_LABELS_JSON}" '$block - ($block - .) | .[]' <<<"${labels}")
            if [[ -n "${blocking}" ]]; then
              ineligible=true
            fi

            if ! reviews=$(gh api --paginate --slurp "repos/${REPO}/pulls/${pr}/reviews" | jq 'add // []'); then
              echo "::warning::Cannot read reviews for PR #${pr}; skipping"
              continue
            fi
            if human_cr_outstanding "${reviews}"; then
              ineligible=true
            fi

            if [[ "${ineligible}" == "true" ]]; then
              if [[ "${has_auto}" == "true" ]]; then
                echo "Disabling auto-merge on ineligible PR #${pr}"
                gh pr merge "$pr" --repo "${REPO}" --disable-auto || true
              fi
              continue
            fi

            while read -r review_id; do
              [[ -z "${review_id}" ]] && continue
              echo "Dismissing bot review ${review_id} on PR #${pr}"
              gh api "repos/${REPO}/pulls/${pr}/reviews/${review_id}/dismissals" \
                -X PUT -f message="Auto-dismissed: bot Request changes do not block merge" \
                || echo "::warning::Cannot dismiss review ${review_id} on PR #${pr}"
            done < <(jq -r '
              .[]
              | select(.state == "CHANGES_REQUESTED")
              | select(.user != null)
              | select(((.user.login // "") | endswith("[bot]")) or ((.user.type // "") == "Bot"))
              | .id
            ' <<<"${reviews}")

            if [[ "${has_auto}" == "false" ]]; then
              echo "Enabling auto-merge on PR #${pr}"
              gh pr merge "$pr" --repo "${REPO}" --auto --rebase \
                || echo "::warning::Cannot enable auto-merge on PR #${pr}"
            fi
          done < <(echo "$prs" | jq -r '.[].number')
          echo "Scan complete."
